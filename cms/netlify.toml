# Netlify site with base directory "cms".
[build]
  command = "node scripts/build-static.mjs"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # The page preview renders with the website's own templates (../tools), which read the photo
  # registry (../data) and draw the brand marks in program covers (../assets/icons). The
  # photos themselves are not bundled: the preview loads them from the public website.
  included_files = ["../tools/**", "shared/**", "fixtures/seed.json", "../data/*.json", "../assets/icons/**"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' https: data:; media-src 'self' https:; frame-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'self' https:; form-action 'self' https://accounts.google.com; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"
