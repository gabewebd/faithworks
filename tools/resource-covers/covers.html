<!doctype html>
<!-- Composer for the Resources featured images. Each scene is written as plain SVG markup:
     window.compose(name) returns the finished SVG document (text measured with the real font) and
     render.mjs --compose saves it as svg/<slug>.svg. Those SVG files are the sources: render.mjs
     exports the PNGs from them, so an SVG edited by hand exports the same way.
     Brand visuals, not interfaces: recognizable logos on large white tiles are the focus. Concepts
     are chips in the program pages' hero style ("Website form / New enquiry"): a compact white card
     holding the site's line icon on a Faith Pink or AI Yellow tile (as .promise__icon), a short
     title and a muted line under it. Nothing else carries text.
     Rules: brand palette only; smooth backgrounds, no texture; connectors are straight segments
     only; each image has its own gradient direction. Logos are the site's own files in
     assets/icons/tools/, embedded as symbols in their real colours. Key content stays inside the
     area both crops keep: 16:10 on cards (x 96–1824) and 21:9 at the top of articles (y 128–952). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=block">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><text id="m" font-family="Inter"></text></svg>
<script>
const C = { pink: "#EFACBA", yellow: "#FBC522", white: "#FAF8F4", ink: "#1A1A1A" };
const LOGOS = ["chatgpt", "claude-color", "gemini", "grok", "codex-color", "openclaw", "hermes-agent", "obsidian", "claude-code-color", "perplexity", "notebooklm", "gamma", "gmail", "google-calendar", "google-sheets", "google-drive", "google-docs", "github", "microsoft-copilot", "canva", "zapier", "netlify", "shadcn", "magicui", "motion", "threejs", "remotion", "groq", "openai", "playwright"];
const FONTS = "https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;display=block";
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---- Concept icons: the site's line-icon language on a 48-unit grid ---- */
const N = `fill="${C.white}" stroke="${C.ink}" stroke-width="2.2" stroke-linejoin="round"`;   // a shape
const L = `fill="none" stroke="${C.ink}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"`; // a line
const K = `fill="${C.ink}"`;                                                                     // the accent
const ICONS = {
  chat: `<path ${N} d="M6 8h36v24H20l-9 8v-8H6Z"/><path ${L} d="M13 17h22M13 24h13"/><circle ${K} cx="34" cy="24" r="3"/>`,
  done: `<rect ${N} x="6" y="6" width="36" height="36" rx="4"/><path ${L} d="M15 25l6 6 12-14"/>`,
  megaphone: `<path ${N} d="M7 18h9l18-10v32L16 30H7Z"/><path ${L} d="M16 30l3 10h6l-3-10M40 20v8"/><rect ${K} x="7" y="18" width="5" height="12"/>`,
  people: `<circle ${N} cx="17" cy="15" r="6"/><circle ${N} cx="33" cy="17" r="5"/><path ${N} d="M6 40l3-14h16l3 14Z"/><path ${K} d="M27 40l2-11h10l3 11Z"/>`,
  chart: `<path ${L} d="M5 42h38"/><rect ${N} x="9" y="25" width="7" height="17"/><rect ${K} x="20.5" y="14" width="7" height="28"/><rect ${N} x="32" y="6" width="7" height="36"/>`,
  process: `<rect ${N} x="5" y="18" width="12" height="12" rx="2"/><rect ${K} x="31" y="5" width="12" height="12" rx="2"/><rect ${N} x="31" y="31" width="12" height="12" rx="2"/><path ${L} d="M17 24h7V11h7M24 24v13h7"/>`,
  book: `<path ${N} d="M5 10h15l4 4 4-4h15v28H28l-4 4-4-4H5Z"/><path ${L} d="M24 14v28M10 18h8M10 24h8M30 18h8"/>`,
  growth: `<path ${L} d="M5 42h38M8 34l10-10 7 7 14-14"/><path ${K} d="M31 13h10v10Z"/>`,
  mail: `<rect ${N} x="5" y="10" width="38" height="28" rx="3"/><path ${L} d="M6 12l18 14 18-14"/>`,
  doc: `<path ${N} d="M10 4h20l8 8v32H10Z"/><path ${L} d="M30 4v8h8M16 21h16M16 28h16M16 35h9"/><rect ${K} x="16" y="13" width="8" height="3"/>`,
  idea: `<path ${K} d="M22 5l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/><path ${N} d="M37 29l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/>`,
  target: `<circle ${N} cx="24" cy="24" r="18"/><circle ${N} cx="24" cy="24" r="11"/><circle ${K} cx="24" cy="24" r="4"/><path ${L} d="M24 24l15-15M33 9h6v6"/>`,
  week: `<rect ${N} x="6" y="9" width="36" height="33" rx="3"/><path ${L} d="M6 18h36M16 5v8M32 5v8M17 30l5 5 9-10"/>`,
  shield: `<path ${N} d="M24 4l16 6v12c0 10-7 17-16 22C15 39 8 32 8 22V10Z"/><path ${L} d="M17 24l5 5 9-10"/>`,
  assist: `<path ${N} d="M8 5h21l8 8v30H8Z"/><path ${L} d="M29 5v8h8M14 21h15M14 28h10"/><path ${K} d="M37 27l2.6 6.4L46 36l-6.4 2.6L37 45l-2.6-6.4L28 36l6.4-2.6Z"/>`,
  branch: `<circle ${N} cx="14" cy="10" r="4"/><circle ${N} cx="14" cy="38" r="4"/><circle ${K} cx="34" cy="14" r="4"/><path ${L} d="M14 14v20M34 18v6L14 34"/>`,
  search: `<circle ${N} cx="20" cy="20" r="13"/><path ${L} d="M30 30l12 12"/><circle ${K} cx="20" cy="20" r="4"/>`,
  form: `<rect ${N} x="8" y="4" width="32" height="40" rx="3"/><path ${L} d="M15 14h18M15 24h18M15 34h10"/><circle ${K} cx="33" cy="34" r="3.5"/>`,
  person: `<circle ${N} cx="24" cy="15" r="9"/><path ${N} d="M7 43c1-10 8-16 17-16s16 6 17 16Z"/><circle ${K} cx="24" cy="15" r="3"/>`,
  key: `<circle ${N} cx="15" cy="24" r="10"/><circle ${K} cx="15" cy="24" r="3.5"/><path ${L} d="M25 24h18M37 24v7M43 24v5"/>`,
  card: `<rect ${N} x="4" y="10" width="40" height="28" rx="4"/><path ${L} d="M4 18h40"/><rect ${K} x="10" y="26" width="10" height="5" rx="1"/>`,
  copy: `<rect ${N} x="14" y="4" width="26" height="30" rx="3"/><rect ${N} x="8" y="14" width="26" height="30" rx="3"/><path ${L} d="M14 24h14M14 32h10"/>`,
  globe: `<circle ${N} cx="24" cy="24" r="19"/><path ${L} d="M5 24h38M24 5c-6 6-8 12-8 19s2 13 8 19M24 5c6 6 8 12 8 19s-2 13-8 19"/><circle ${K} cx="24" cy="24" r="3.5"/>`,
  id: `<rect ${N} x="4" y="8" width="40" height="32" rx="4"/><circle ${N} cx="16" cy="22" r="5"/><path ${L} d="M8 34c1-5 4-7 8-7s7 2 8 7M28 18h10M28 25h10"/><rect ${K} x="28" y="30" width="7" height="3"/>`,
};

/* ---- Pieces ---- */
const width = (str, weight, size) => { const m = document.getElementById("m"); m.setAttribute("font-weight", weight); m.setAttribute("font-size", size); m.textContent = str; return m.getComputedTextLength(); };
// The lift every element shares: a white halo and a soft Charcoal shadow
const halo = (x, y, w, h, rx) => `<rect x="${x - 10}" y="${y - 10}" width="${w + 20}" height="${h + 20}" rx="${rx + 10}" fill="#FFFFFF" fill-opacity="0.45" filter="url(#shadow)"/>`;
// The site's icon: line icon on a pink or yellow tile with a faint top light
function iconTile(x, y, s, name, fill) {
  const rx = Math.round(s * 0.22), i = Math.round(s * 0.62), o = (s - i) / 2;
  return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${rx}" fill="${C[fill]}"/><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${rx}" fill="url(#light)"/>` +
    `<svg x="${x + o}" y="${y + o}" width="${i}" height="${i}" viewBox="0 0 48 48" overflow="visible">${ICONS[name]}</svg>`;
}
// A logo on a large white tile (s square, top-left x, y)
function logo(x, y, s, name) {
  const rx = Math.round(s * 0.22), i = Math.round(s * 0.54), o = (s - i) / 2;
  return `<g>${halo(x, y, s, s, rx)}<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${rx}" fill="#FFFFFF"/><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${rx}" fill="url(#light)"/><use href="#logo-${name}" x="${x + o}" y="${y + o}" width="${i}" height="${i}" color="${C.ink}"/></g>`;
}
// A concept chip centred on (cx, cy): icon tile, title, a muted line. Returns its svg and edges.
function chip(cx, cy, iconName, fill, title, sub) {
  const h = 120, t = 80, pad = 20, gap = 22, w = Math.round(pad + t + gap + Math.max(width(title, 600, 29), width(sub, 500, 23)) + 34);
  const x = Math.round(cx - w / 2), y = Math.round(cy - h / 2), tx = x + pad + t + gap;
  const svg = `<g>${halo(x, y, w, h, 24)}<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="24" fill="#FFFFFF" fill-opacity="0.94"/>${iconTile(x + pad, y + (h - t) / 2, t, iconName, fill)}` +
    `<text x="${tx}" y="${y + 52}" font-family="Inter" font-weight="600" font-size="29" fill="${C.ink}">${esc(title)}</text>` +
    `<text x="${tx}" y="${y + 88}" font-family="Inter" font-weight="500" font-size="23" fill="${C.ink}" fill-opacity="0.55">${esc(sub)}</text></g>`;
  return { svg, w, left: x, right: x + w, top: y, bottom: y + h };
}
// Connectors: straight segments only
const wire = (pts) => `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${C.ink}" stroke-opacity="0.22" stroke-width="3" stroke-linejoin="miter"/>`;
const node = (x, y, fill = C.pink, r = 10) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#FFFFFF" stroke-width="5"/>`;
const ends = (wires, fill) => wires.flatMap((p) => [node(...p[0], fill), node(...p[p.length - 1], fill)]).join("");

/* ---- Shared definitions; each scene adds its own background gradient ---- */
async function defs(bg, extra = "") {
  const symbols = await Promise.all(LOGOS.map(async (n) => {
    const src = await (await fetch(`/assets/icons/tools/${n}.svg`)).text();
    const vb = src.match(/viewBox="([^"]+)"/)[1], root = src.match(/<svg[^>]*>/)[0];
    // paint set on the logo's own <svg> (fill, or stroke for line logos such as Gamma) moves to the symbol
    const paint = ["fill", "stroke", "stroke-width", "stroke-linecap", "stroke-linejoin"].map((a) => { const m = root.match(new RegExp(`[ \\t\\n]${a}="([^"]+)"`)); return m ? ` ${a}="${m[1]}"` : ""; }).join("");
    const inner = src.replace(/^[\s\S]*?<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "").replace(/\sid="([^"]*)"/g, ` id="logo-${n}-$1"`).replace(/url\(#([^)]+)\)/g, `url(#logo-${n}-$1)`).replace(/\s+/g, " ").trim(); // ids kept (gradients), made unique per logo
    return `<symbol id="logo-${n}" viewBox="${vb}"${paint}>${inner}</symbol>`;
  }));
  return `<defs>
<style>@import url("${FONTS}");</style>
${bg}
<linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="${C.ink}" flood-opacity="0.13"/></filter>
${extra}
${symbols.join("\n")}
</defs>`;
}
const doc = (title, desc, d, body) => `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>${esc(title)}</title>
<desc>${esc(desc)}</desc>
${d}
<rect width="1920" height="1080" fill="url(#bg)"/>
${body}
</svg>
`;
const layer = (id, content) => `<g id="${id}">${content}</g>\n`;

/* ---- 1. AI Is Not Another Niche Skill — radial gradient: three AI tools at the centre, wired to six kinds of work ---- */
async function niche() {
  const bg = `<radialGradient id="bg" cx="960" cy="540" r="1100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F6D0D8"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE6A6"/></radialGradient>`;
  const top = [[430, "megaphone", "pink", "Marketing", "Campaign drafts"], [960, "people", "yellow", "People", "Policy summaries"], [1490, "chart", "pink", "Finance", "Report checks"]].map(([x, ...a]) => chip(x, 218, ...a));
  const bottom = [[430, "process", "yellow", "Operations", "Process maps"], [960, "book", "pink", "Learning", "Lesson plans"], [1490, "growth", "yellow", "Growth", "Sales prep"]].map(([x, ...a]) => chip(x, 862, ...a));
  const wires = [
    [[745, 540], [825, 540]], [[1095, 540], [1175, 540]],
    [[960, top[1].bottom], [960, 405]], [[430, top[0].bottom], [430, 365], [635, 365], [635, 430]], [[1490, top[2].bottom], [1490, 365], [1285, 365], [1285, 430]],
    [[960, bottom[1].top], [960, 675]], [[430, bottom[0].top], [430, 715], [635, 715], [635, 650]], [[1490, bottom[2].top], [1490, 715], [1285, 715], [1285, 650]],
  ];
  const body = layer("connectors", wires.map(wire).join("")) + layer("work", [...top, ...bottom].map((c) => c.svg).join("")) +
    layer("ai-tools", logo(525, 430, 220, "chatgpt") + logo(825, 405, 270, "claude-color") + logo(1175, 430, 220, "gemini")) + layer("nodes", ends(wires));
  return doc("AI Is Not Another Niche Skill", "ChatGPT, Claude and Gemini at the centre, joined by straight lines to six kinds of work: marketing, people, finance, operations, learning and growth.", await defs(bg), body);
}

/* ---- 2. AI agents — horizontal gradient: an instruction, the agent, its tools, a result ---- */
async function agents() {
  const bg = `<linearGradient id="bg" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F3C2CC"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE3A0"/></linearGradient>`;
  const ask = ["chat", "pink", "Your instruction", "Plan our team offsite"], res = ["done", "yellow", "Ready for review", "Shortlist and email"];
  const aw = chip(0, 0, ...ask).w, rw = chip(0, 0, ...res).w;
  const as = 240, ts = 150, gap = 80; // agent and tool tile sizes, the space a connector spans
  const total = aw + gap + as + gap * 1.6 + ts + gap * 1.6 + rw, x0 = Math.round(960 - total / 2);
  const a = chip(x0 + aw / 2, 540, ...ask), agX = a.right + gap, tX = Math.round(agX + as + gap * 1.6), r = chip(Math.round(tX + ts + gap * 1.6 + rw / 2), 540, ...res);
  const sx = Math.round(agX + as + gap * 0.8), mx = Math.round(tX + ts + gap * 0.8), ys = [320, 540, 760];
  const wires = [
    [[a.right, 540], [agX, 540]],
    [[agX + as, 540], [sx, 540], [sx, ys[0]], [tX, ys[0]]], [[sx, 540], [tX, 540]], [[sx, 540], [sx, ys[2]], [tX, ys[2]]],
    [[tX + ts, ys[0]], [mx, ys[0]], [mx, 540], [r.left, 540]], [[tX + ts, 540], [r.left, 540]], [[tX + ts, ys[2]], [mx, ys[2]], [mx, 540]],
  ];
  const nodes = [[a.right, 540], [agX, 540], [agX + as, 540], ...ys.flatMap((y) => [[tX, y], [tX + ts, y]])].map((p) => node(...p)).join("") + node(r.left, 540, C.yellow);
  const body = layer("connectors", wires.map(wire).join("")) + layer("instruction", a.svg) + layer("agent", logo(agX, 540 - as / 2, as, "claude-color")) +
    layer("tools", ["google-calendar", "google-sheets", "gmail"].map((n, i) => logo(tX, ys[i] - ts / 2, ts, n)).join("")) + layer("result", r.svg) + layer("nodes", nodes);
  return doc("AI Agents Explained", "Your instruction goes to an AI agent (Claude), which uses your tools (Google Calendar, Google Sheets, Gmail) and returns a result ready for your review, all joined by straight lines.", await defs(bg), body);
}

/* ---- 3. AI for beginners — vertical gradient: three everyday tasks, each joined to a tool that helps ---- */
async function beginners() {
  const bg = `<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5CCD4"/><stop offset="0.55" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE5A8"/></linearGradient>`;
  const xs = [400, 960, 1520];
  const tasks = [["mail", "pink", "Write an email", "Thank-you note"], ["doc", "yellow", "Summarize a report", "Key points first"], ["idea", "pink", "Brainstorm ideas", "Workshop themes"]].map((a, i) => chip(xs[i], 300, ...a));
  const tools = ["chatgpt", "claude-color", "gemini"], ts = 200, ty = 640;
  const wires = [[[xs[0], 500], [xs[2], 500]], ...xs.map((x) => [[x, tasks[0].bottom], [x, ty]])];
  const body = layer("connectors", wires.map(wire).join("")) + layer("tasks", tasks.map((c) => c.svg).join("")) + layer("tools", tools.map((n, i) => logo(xs[i] - ts / 2, ty, ts, n)).join("")) +
    layer("nodes", xs.map((x) => node(x, tasks[0].bottom) + node(x, 500, C.yellow, 8) + node(x, ty)).join(""));
  return doc("AI for Beginners: What It Can Do at Work, and What It Can't", "Three everyday tasks (write an email, summarize a report, brainstorm ideas), each joined by a straight line to an AI tool that helps (ChatGPT, Claude, Gemini).", await defs(bg), body);
}

/* ---- 4. Purpose before productivity — diagonal gradient (top right to bottom left): people, then purpose, then the work, then the tool ---- */
async function purpose() {
  const bg = `<linearGradient id="bg" x1="1920" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FCE3A0"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#F2BDC8"/></linearGradient>`;
  const extra = `<clipPath id="photoClip"><rect x="150" y="170" width="860" height="740" rx="40"/></clipPath>
<linearGradient id="photoTint" x1="1010" y1="170" x2="580" y2="910" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${C.pink}" stop-opacity="0.3"/><stop offset="0.5" stop-color="${C.pink}" stop-opacity="0"/></linearGradient>`;
  const p = chip(1400, 262, "target", "pink", "Start with purpose", "Why this work matters");
  const w = chip(1500, 540, "week", "yellow", "Work worth doing", "Three priorities");
  const cs = 180, cx = 1180, cy = 730; // Claude, last
  const wires = [[[1010, 262], [p.left, 262]], [[1400, p.bottom], [1400, w.top]], [[1500, w.bottom], [1500, cy + cs / 2], [cx + cs, cy + cs / 2]]];
  const body = layer("people", `<rect x="138" y="158" width="884" height="764" rx="52" fill="#FFFFFF" fill-opacity="0.45" filter="url(#shadow)"/><image href="../../../assets/images/web/roundtable-1920.webp" x="150" y="170" width="860" height="740" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/><rect x="150" y="170" width="860" height="740" rx="40" fill="url(#photoTint)"/>`) +
    layer("connectors", wires.map(wire).join("")) + layer("purpose", p.svg) + layer("work", w.svg) + layer("tool", logo(cx, cy, cs, "claude-color")) +
    layer("nodes", ends(wires.slice(0, 2)) + node(1500, w.bottom) + node(cx + cs, cy + cs / 2, C.yellow));
  return doc("Purpose Before Productivity", "A Faith Works roundtable photo joined by straight lines to purpose (why this work matters), the work worth doing (three priorities), and only then the tool (Claude).", await defs(bg, extra), body);
}

/* ---- 5. GitHub for non-developers — diagonal gradient (bottom left to top right): GitHub and Claude, joined by version history ---- */
async function github() {
  const bg = `<linearGradient id="bg" x1="0" y1="1080" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F4C6D0"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE8AE"/></linearGradient>`;
  const v = chip(960, 540, "branch", "yellow", "Every change saved", "Version history");
  const gs = 320, gx = 230, cs = 290, cx = 1690 - cs;
  const wires = [[[gx + gs, 540], [v.left, 540]], [[v.right, 540], [cx, 540]]];
  const body = layer("connectors", wires.map(wire).join("")) + layer("github", logo(gx, 540 - gs / 2, gs, "github")) + layer("history", v.svg) +
    layer("claude", logo(cx, 540 - cs / 2, cs, "claude-color")) + layer("nodes", ends(wires));
  return doc("GitHub for Non-Developers", "The GitHub mark and the Claude mark, joined by one straight line through version history: every change saved.", await defs(bg), body);
}

/* ---- 6. How to set up your AI agent — diagonal gradient (top left to bottom right): three setup
   steps wired into the agent, which reaches the connected tools ---- */
async function setup() {
  const bg = `<linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F4C4CE"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE2A0"/></linearGradient>`;
  const ys = [300, 540, 780];
  const steps = [["doc", "yellow", "Instructions", "The job, in writing"], ["shield", "pink", "Tools and access", "Read-only first"], ["done", "yellow", "Your approval", "Nothing goes out unchecked"]];
  const ws = steps.map((a) => chip(0, 0, ...a).w), cw = Math.max(...ws);
  const as = 300, ax = 960 - as / 2, ts = 150, tx = 1500; // the agent tile and the tool tiles
  const cx = Math.round(ax - 150 - cw / 2); // chips share a right edge 150 px left of the agent
  const chips = steps.map((a, i) => chip(cx + (cw - ws[i]) / 2, ys[i], ...a));
  const lb = Math.round(ax - 75), rb = Math.round(ax + as + (tx - ax - as) / 2);
  const wires = [
    ...chips.map((c, i) => (i === 1 ? [[c.right, 540], [ax, 540]] : [[c.right, ys[i]], [lb, ys[i]], [lb, 540]])),
    [[ax + as, 540], [tx, 540]], [[rb, 540], [rb, ys[0]], [tx, ys[0]]], [[rb, 540], [rb, ys[2]], [tx, ys[2]]],
  ];
  const agent = `<g>${halo(ax, 540 - as / 2, as, as, 66)}<rect x="${ax}" y="${540 - as / 2}" width="${as}" height="${as}" rx="66" fill="#FFFFFF"/><rect x="${ax}" y="${540 - as / 2}" width="${as}" height="${as}" rx="66" fill="url(#light)"/>${iconTile(ax + 60, 540 - as / 2 + 60, as - 120, "idea", "pink")}</g>`;
  const nodes = chips.map((c, i) => node(c.right, ys[i])).join("") + node(ax, 540) + node(ax + as, 540, C.yellow) + ys.map((y) => node(tx, y)).join("");
  const body = layer("connectors", wires.map(wire).join("")) + layer("setup-steps", chips.map((c) => c.svg).join("")) + layer("agent", agent) +

  const dir = "/assets/images/resources/goodbye-prompt-engineering-hello-role-engineering";
  const T = (x, y, s, size, weight = 500, extra = "") => `<text x="${x}" y="${y}" font-family="Inter" font-weight="${weight}" font-size="${size}" fill="${C.ink}"${extra}>${esc(s)}</text>`;

  const FS = 21, LH = 30;
  function wrap(text, max) {

  sy += 74; out += T(X + 30, sy, "Group chats", 17, 600, ' letter-spacing="0.5"');

  for (const [id, n, r] of team) { out += bot(id, X + 26, sy + 6, 54) + T(X + 94, sy + 32, n, 21, 600) + T(X + 94, sy + 57, r, 17); sy += 76; }

  // chat header
  out += grok(MX + 32, Y + 18, 58) + T(MX + 106, Y + 46, "AI Team", 27, 600) + T(MX + 106, Y + 72, "Sample team · 5 Bots and you", 18);

  out += `<rect x="${MX + 32}" y="${cy}" width="${MW - 64}" height="56" rx="28" fill="#FFFFFF" stroke="${C.ink}" stroke-opacity="0.12" stroke-width="1.5"/>` +
