<!doctype html>
<!-- Composer for the Resources featured images. Each scene is written as plain SVG markup:
     window.compose(name) returns the finished SVG document and render.mjs --compose saves it as
     svg/<slug>.svg. Those SVG files are the sources: render.mjs exports the PNGs from them, so an
     SVG edited by hand exports the same way.
     Brand visuals, not interfaces: recognizable logos on large white tiles are the focus, joined
     to a few concept icons (the site's line icons, as in .promise__icon: a Faith Pink or AI Yellow
     tile, Charcoal strokes, Works White fills, one solid Charcoal accent). No text, no cards.
     Rules: brand palette only; smooth backgrounds, no texture; connectors are straight segments
     only; each image has its own gradient direction. Logos are the site's own files in
     assets/icons/tools/, embedded as symbols in their real colours. Key content stays inside the
     area both crops keep: 16:10 on cards (x 96–1824) and 21:9 at the top of articles (y 128–952). -->
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
<script>
const C = { pink: "#EFACBA", yellow: "#FBC522", white: "#FAF8F4", ink: "#1A1A1A" };
const LOGOS = ["chatgpt", "claude-color", "gemini", "gmail", "google-calendar", "google-sheets", "github"];
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---- Concept icons: the site's line-icon language on a 48-unit grid ---- */
const N = `fill="${C.white}" stroke="${C.ink}" stroke-width="2.2" stroke-linejoin="round"`;   // a shape
const L = `fill="none" stroke="${C.ink}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"`; // a line
const K = `fill="${C.ink}"`;                                                                     // the accent
const ICONS = {
  chat: `<path ${N} d="M6 8h36v24H20l-9 8v-8H6Z"/><path ${L} d="M13 17h22M13 24h13"/><circle ${K} cx="34" cy="24" r="3"/>`,
  done: `<rect ${N} x="6" y="6" width="36" height="36" rx="4"/><path ${L} d="M15 25l6 6 12-14"/>`,
  megaphone: `<path ${N} d="M7 18h9l18-10v32L16 30H7Z"/><path ${L} d="M16 30l3 10h6l-3-10M40 20v8"/><rect ${K} x="7" y="18" width="5" height="12"/>`,
  people: `<circle ${N} cx="17" cy="15" r="6"/><circle ${N} cx="33" cy="17" r="5"/><path ${N} d="M6 40l3-14h16l3 14Z"/><path ${K} d="M27 40l2-11h10l3 11Z"/>`,
  chart: `<path ${L} d="M5 42h38"/><rect ${N} x="9" y="25" width="7" height="17"/><rect ${K} x="20.5" y="14" width="7" height="28"/><rect ${N} x="32" y="6" width="7" height="36"/>`,
  process: `<rect ${N} x="5" y="18" width="12" height="12" rx="2"/><rect ${K} x="31" y="5" width="12" height="12" rx="2"/><rect ${N} x="31" y="31" width="12" height="12" rx="2"/><path ${L} d="M17 24h7V11h7M24 24v13h7"/>`,
  book: `<path ${N} d="M5 10h15l4 4 4-4h15v28H28l-4 4-4-4H5Z"/><path ${L} d="M24 14v28M10 18h8M10 24h8M30 18h8"/>`,
  growth: `<path ${L} d="M5 42h38M8 34l10-10 7 7 14-14"/><path ${K} d="M31 13h10v10Z"/>`,
  mail: `<rect ${N} x="5" y="10" width="38" height="28" rx="3"/><path ${L} d="M6 12l18 14 18-14"/>`,
  doc: `<path ${N} d="M10 4h20l8 8v32H10Z"/><path ${L} d="M30 4v8h8M16 21h16M16 28h16M16 35h9"/><rect ${K} x="16" y="13" width="8" height="3"/>`,
  idea: `<path ${K} d="M22 5l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/><path ${N} d="M37 29l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/>`,
  target: `<circle ${N} cx="24" cy="24" r="18"/><circle ${N} cx="24" cy="24" r="11"/><circle ${K} cx="24" cy="24" r="4"/><path ${L} d="M24 24l15-15M33 9h6v6"/>`,
  week: `<rect ${N} x="6" y="9" width="36" height="33" rx="3"/><path ${L} d="M6 18h36M16 5v8M32 5v8M17 30l5 5 9-10"/>`,
  branch: `<circle ${N} cx="14" cy="10" r="4"/><circle ${N} cx="14" cy="38" r="4"/><circle ${K} cx="34" cy="14" r="4"/><path ${L} d="M14 14v20M34 18v6L14 34"/>`,
};

/* ---- Pieces ---- */
// A tile: Faith Pink, AI Yellow or white, lifted by a soft Charcoal shadow, a white halo and a
// faint top light (the only dimensional touches)
function tile(x, y, s, fill) {
  const rx = Math.round(s * 0.22), f = fill === "white" ? "#FFFFFF" : C[fill];
  return `<rect x="${x - 12}" y="${y - 12}" width="${s + 24}" height="${s + 24}" rx="${rx + 12}" fill="#FFFFFF" fill-opacity="0.45" filter="url(#shadow)"/>` +
    `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${rx}" fill="${f}"/><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${rx}" fill="url(#light)"/>`;
}
// A concept icon on a pink or yellow tile (the icon fills 62% of it, as on the site)
function icon(x, y, s, name, fill) {
  const i = Math.round(s * 0.62), o = (s - i) / 2;
  return `<g>${tile(x, y, s, fill)}<svg x="${x + o}" y="${y + o}" width="${i}" height="${i}" viewBox="0 0 48 48" overflow="visible">${ICONS[name]}</svg></g>`;
}
// A logo on a white tile
function logo(x, y, s, name) {
  const i = Math.round(s * 0.54), o = (s - i) / 2;
  return `<g>${tile(x, y, s, "white")}<use href="#logo-${name}" x="${x + o}" y="${y + o}" width="${i}" height="${i}" color="${C.ink}"/></g>`;
}
// Connectors: straight segments only
const wire = (pts) => `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${C.ink}" stroke-opacity="0.22" stroke-width="3" stroke-linejoin="miter"/>`;
const node = (x, y, fill = C.pink, r = 10) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#FFFFFF" stroke-width="5"/>`;
const ends = (wires, fill) => wires.flatMap((p) => [node(...p[0], fill), node(...p[p.length - 1], fill)]).join("");

/* ---- Shared definitions; each scene adds its own background gradient ---- */
async function defs(bg, extra = "") {
  const symbols = await Promise.all(LOGOS.map(async (n) => {
    const src = await (await fetch(`/assets/icons/tools/${n}.svg`)).text();
    const vb = src.match(/viewBox="([^"]+)"/)[1], fill = (src.match(/<svg[^>]*\sfill="([^"]+)"/) || [])[1];
    const inner = src.replace(/^[\s\S]*?<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "").replace(/\sid="[^"]*"/g, "").replace(/\s+/g, " ").trim();
    return `<symbol id="logo-${n}" viewBox="${vb}"${fill ? ` fill="${fill}"` : ""}>${inner}</symbol>`;
  }));
  return `<defs>
${bg}
<linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="${C.ink}" flood-opacity="0.13"/></filter>
${extra}
${symbols.join("\n")}
</defs>`;
}
const doc = (title, desc, d, body) => `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>${esc(title)}</title>
<desc>${esc(desc)}</desc>
${d}
<rect width="1920" height="1080" fill="url(#bg)"/>
${body}
</svg>
`;
const layer = (id, content) => `<g id="${id}">${content}</g>\n`;

/* ---- 1. AI Is Not Another Niche Skill — radial gradient: three AI tools at the centre, wired to six kinds of work ---- */
async function niche() {
  const bg = `<radialGradient id="bg" cx="960" cy="540" r="1100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F6D0D8"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE6A6"/></radialGradient>`;
  const wires = [
    [[745, 540], [825, 540]], [[1095, 540], [1175, 540]],
    [[960, 300], [960, 405]], [[460, 300], [460, 365], [635, 365], [635, 430]], [[1460, 300], [1460, 365], [1285, 365], [1285, 430]],
    [[960, 780], [960, 675]], [[460, 780], [460, 715], [635, 715], [635, 650]], [[1460, 780], [1460, 715], [1285, 715], [1285, 650]],
  ];
  const work = layer("work", icon(385, 150, 150, "megaphone", "pink") + icon(885, 150, 150, "people", "yellow") + icon(1385, 150, 150, "chart", "pink") +
    icon(385, 780, 150, "process", "yellow") + icon(885, 780, 150, "book", "pink") + icon(1385, 780, 150, "growth", "yellow"));
  const tools = layer("ai-tools", logo(525, 430, 220, "chatgpt") + logo(825, 405, 270, "claude-color") + logo(1175, 430, 220, "gemini"));
  return doc("AI Is Not Another Niche Skill", "ChatGPT, Claude and Gemini at the centre, joined by straight lines to six kinds of work: marketing, people, finance, operations, learning and growth.",
    await defs(bg), layer("connectors", wires.map(wire).join("")) + work + tools + layer("nodes", ends(wires)));
}

/* ---- 2. AI agents — horizontal gradient: an instruction, the agent, its tools, a result ---- */
async function agents() {
  const bg = `<linearGradient id="bg" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F3C2CC"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE3A0"/></linearGradient>`;
  const wires = [
    [[360, 540], [520, 540]],
    [[800, 540], [900, 540], [900, 300], [1000, 300]], [[900, 540], [1000, 540]], [[900, 540], [900, 780], [1000, 780]],
    [[1170, 300], [1310, 300], [1310, 540], [1450, 540]], [[1170, 540], [1450, 540]], [[1170, 780], [1310, 780], [1310, 540]],
  ];
  const nodes = [[360, 540], [520, 540], [800, 540], [1000, 300], [1000, 540], [1000, 780], [1170, 300], [1170, 540], [1170, 780]].map((p) => node(...p)).join("") + node(1450, 540, C.yellow);
  const body = layer("connectors", wires.map(wire).join("")) +
    layer("instruction", icon(170, 445, 190, "chat", "pink")) + layer("agent", logo(520, 400, 280, "claude-color")) +
    layer("tools", logo(1000, 215, 170, "google-calendar") + logo(1000, 455, 170, "google-sheets") + logo(1000, 695, 170, "gmail")) +
    layer("result", icon(1450, 435, 210, "done", "yellow")) + layer("nodes", nodes);
  return doc("AI Agents Explained", "An instruction goes to an AI agent (Claude), which uses tools (Google Calendar, Google Sheets, Gmail) and returns a finished result, all joined by straight lines.", await defs(bg), body);
}

/* ---- 3. AI for beginners — vertical gradient: everyday tasks and the tools that help, along one straight line ---- */
async function beginners() {
  const bg = `<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5CCD4"/><stop offset="0.55" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE5A8"/></linearGradient>`;
  const tasks = [[150, "mail", "pink"], [710, "doc", "yellow"], [1270, "idea", "pink"]], tools = [[430, "chatgpt"], [990, "claude-color"], [1550, "gemini"]];
  const spine = [[245, 540], [1650, 540]];
  const stubs = [...tasks.map(([x]) => [[x + 95, 430], [x + 95, 540]]), ...tools.map(([x]) => [[x + 100, 540], [x + 100, 650]])];
  const body = layer("connectors", wire(spine) + stubs.map(wire).join("")) +
    layer("tasks", tasks.map(([x, n, f]) => icon(x, 240, 190, n, f)).join("")) + layer("tools", tools.map(([x, n]) => logo(x, 650, 200, n)).join("")) +
    layer("nodes", tasks.map(([x]) => node(x + 95, 430)).join("") + tools.map(([x]) => node(x + 100, 650)).join("") + stubs.map((s) => node(s[0][0], 540, C.yellow, 8)).join(""));
  return doc("AI for Beginners: What It Can Do at Work, and What It Can't", "Everyday tasks (an email, a document, new ideas) alternating with the AI tools that help with them (ChatGPT, Claude, Gemini) along one straight line.", await defs(bg), body);
}

/* ---- 4. Purpose before productivity — diagonal gradient (top right to bottom left): people, then purpose, then the work, then the tool ---- */
async function purpose() {
  const bg = `<linearGradient id="bg" x1="1920" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FCE3A0"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#F2BDC8"/></linearGradient>`;
  const extra = `<clipPath id="photoClip"><rect x="150" y="170" width="900" height="740" rx="40"/></clipPath>
<linearGradient id="photoTint" x1="1050" y1="170" x2="600" y2="910" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${C.pink}" stop-opacity="0.3"/><stop offset="0.5" stop-color="${C.pink}" stop-opacity="0"/></linearGradient>`;
  const wires = [[[1050, 285], [1240, 285]], [[1345, 390], [1345, 540], [1490, 540]], [[1585, 635], [1585, 805], [1430, 805]]];
  const body = layer("people", `<rect x="138" y="158" width="924" height="764" rx="52" fill="#FFFFFF" fill-opacity="0.45" filter="url(#shadow)"/><image href="../../../assets/images/web/roundtable-1920.webp" x="150" y="170" width="900" height="740" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/><rect x="150" y="170" width="900" height="740" rx="40" fill="url(#photoTint)"/>`) +
    layer("connectors", wires.map(wire).join("")) +
    layer("purpose", icon(1240, 180, 210, "target", "pink")) + layer("work", icon(1490, 445, 190, "week", "yellow")) + layer("tool", logo(1260, 720, 170, "claude-color")) +
    layer("nodes", ends(wires.slice(0, 2)) + node(1585, 635) + node(1430, 805, C.yellow));
  return doc("Purpose Before Productivity", "A Faith Works roundtable photo joined by straight lines to purpose (a target), the work worth doing (a planned week), and only then the tool (Claude).", await defs(bg, extra), body);
}

/* ---- 5. GitHub for non-developers — diagonal gradient (bottom left to top right): GitHub and Claude, joined by a branch ---- */
async function github() {
  const bg = `<linearGradient id="bg" x1="0" y1="1080" x2="1920" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F4C6D0"/><stop offset="0.5" stop-color="${C.white}"/><stop offset="1" stop-color="#FCE8AE"/></linearGradient>`;
  const wires = [[[670, 540], [885, 540]], [[1035, 540], [1290, 540]]];
  const body = layer("connectors", wires.map(wire).join("")) + layer("github", logo(330, 370, 340, "github")) + layer("branch", icon(885, 465, 150, "branch", "yellow")) +
    layer("claude", logo(1290, 390, 300, "claude-color")) + layer("nodes", ends(wires));
  return doc("GitHub for Non-Developers", "The GitHub mark and the Claude mark, joined by one straight line through a branch icon.", await defs(bg), body);
}

const SCENES = { niche, agents, beginners, purpose, github };
window.compose = (name) => SCENES[name]();
</script>
</body>
</html>
